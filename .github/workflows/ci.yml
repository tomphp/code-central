# Builds and tests on Linux, macOS and Windows, in jobs that run side by
# side. The Go tests are split into Shards, one test job each: the tests
# internal/testshard hashes to that Shard, untagged and against the
# committed placeholder page, so a Shard needs no Node and no Vite build.
# The test job's matrix sets how many Shards each OS gets. The e2e job on
# each OS builds core.wasm, the Vite build the binaries embed and the
# binaries, then runs both end-to-end suites. These are the steps `make
# test` and `make e2e` run, called directly rather than through make (its
# 60-second budget would trip on a cold runner, and each step gets its own
# log). Every step runs under bash, so the commands are identical on every
# OS and a red run on one OS is a real platform difference. Every Windows
# job shares one setup, the local windows-setup action. The checks that
# don't depend on the OS run once, on Linux: gofmt in its own job, and
# vitest, tsc, ESLint and the Storybook build in the web job. A separate
# job checks the commit messages since the latest tag, and another runs
# the store and cli tests again on Linux against a Postgres service
# container, which no other runner can give.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and ref. A newer push to a pull request cancels the
# older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every commit since the latest tag follows Conventional Commits, as
  # cog.toml defines them: this catches a message that bypassed the
  # commit-msg hook. A separate job, so it neither gates nor is gated by
  # the tests. Full history, so cog can find the tag.
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: cog check
        uses: cocogitto/cocogitto-action@v3
        with:
          check-latest-tag-only: true

  # The store's contract suite, serve's store: block, a service's
  # Registration and core's waits and wakes across two services on a real
  # Postgres, which only a Linux runner can give as a service container. The test
  # jobs below run the same tests without one and skip those cases, naming
  # CODE_CENTRAL_TEST_POSTGRES_URL, as make test does locally.
  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_central_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # -v so the log shows the Postgres cases run, not skipped.
      - name: go test
        env:
          CODE_CENTRAL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/code_central_test?sslmode=disable
        run: go test -v ./store/... ./cli/... ./core/... ./app/...

  # The web checks that don't depend on the OS, run once here rather than
  # on every OS in the test matrix: vitest (in jsdom), tsc, ESLint, the
  # Vite build and the Storybook build. They need core.wasm, the WASM Core
  # the UI's tests and stories run on.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/node_modules, keyed on the OS, the exact Node version and the
      # lockfile, so a lockfile change misses and installs fresh. On a hit
      # npm ci is skipped; on a miss it runs as ever, so the lockfile is
      # still enforced. setup-node's cache above holds only ~/.npm, which
      # still leaves npm ci unpacking every package.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}

      - name: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      # As `make corewasm` builds it. A failing js build fails the run here.
      - name: core.wasm
        run: go run ./internal/corewasm web/src/api/core

      - name: vitest
        working-directory: web
        run: npx vitest run

      - name: tsc
        working-directory: web
        run: npx tsc --noEmit

      - name: eslint
        working-directory: web
        run: npx eslint .

      - name: Vite build
        working-directory: web
        run: npm run build

      # Storybook must keep building, as `make build-components` checks. It
      # needs the WASM Core built above.
      - name: Storybook build
        working-directory: web
        run: npm exec -- storybook build

  # gofmt -l exits zero whatever it finds, so fail on any output. Once, on
  # Linux: what it checks doesn't depend on the OS.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # gofmt needs no modules or build cache.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files aren't gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # The Go tests, one Shard per job. The Shard counts are matrix values, so
  # they can be retuned from measured times without touching the split
  # tool. With one Shard, Linux runs every test, through the same path.
  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 1 }
          - { os: macos-latest, shard: 1, shards: 2 }
          - { os: macos-latest, shard: 2, shards: 2 }
          - { os: windows-latest, shard: 1, shards: 4 }
          - { os: windows-latest, shard: 2, shards: 4 }
          - { os: windows-latest, shard: 3, shards: 4 }
          - { os: windows-latest, shard: 4, shards: 4 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/windows-setup

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Against the committed placeholder page, so no Vite build is needed.
      # The tool runs go test -v, so the log lists every skipped test with
      # its reason: the Postgres cases among them, which the test-postgres
      # job runs.
      - name: go test
        run: go run ./internal/testshard -shard ${{ matrix.shard }} -of ${{ matrix.shards }}

  # What the binaries need and what runs on them, on each OS, alongside
  # the Shards: core.wasm, the Vite build they embed, the binaries, and
  # the Go and UI e2e suites. A longer timeout than the Shards', since a
  # cold Windows runner installs and builds everything before the suites
  # run.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/windows-setup

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # As in the web job: skip npm ci on a hit, run it on a miss.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}

      - name: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      # The WASM Core the UI e2e config's shared test setup loads, as `make
      # corewasm` builds it. A failing js build fails the run here.
      - name: core.wasm
        run: go run ./internal/corewasm web/src/api/core

      # The binaries below embed web/dist, and the UI e2e tests serve it.
      - name: Vite build
        working-directory: web
        run: npm run build

      # As `make build`, with the OS's executable suffix (.exe on Windows,
      # empty elsewhere), and the fake gh `make e2e` builds. The absolute
      # paths go to the e2e steps.
      - name: Build binaries
        run: |
          exe=$(go env GOEXE)
          version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -tags webdist -ldflags "-X github.com/tomoram/code-central/cli.Version=$version" -o "bin/code-central$exe" ./cmd/code-central
          go build -o "bin/code-central-factory$exe" ./cmd/code-central-factory
          go build -o "bin/fake-gh$exe" ./internal/fakegh/gh
          echo "CODE_CENTRAL_BIN=$GITHUB_WORKSPACE/bin/code-central$exe" >> "$GITHUB_ENV"
          echo "CODE_CENTRAL_FACTORY_BIN=$GITHUB_WORKSPACE/bin/code-central-factory$exe" >> "$GITHUB_ENV"
          echo "CODE_CENTRAL_FAKE_GH_BIN=$GITHUB_WORKSPACE/bin/fake-gh$exe" >> "$GITHUB_ENV"

      # Chromium is cached in the workspace, the same path on every OS,
      # keyed on the lockfile (which pins the playwright-core version). On
      # a hit the install is skipped.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v5
        with:
          path: .ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
        run: npx playwright-core install chromium

      - name: Go e2e
        run: go test -v -tags e2e -count=1 ./e2e/

      # PLAYWRIGHT_CHANNEL set but empty: the Chromium installed above, not
      # the system Chrome the suite defaults to.
      - name: UI e2e
        working-directory: web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
        run: PLAYWRIGHT_CHANNEL= npm run test:e2e
