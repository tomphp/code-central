# Builds and tests everything on each OS in the matrix: the same steps
# `make test` and `make e2e` run, called directly rather than through
# make (its 60-second budget would trip on a cold runner, and each step
# gets its own log). Every step runs under bash, so the
# commands are identical on every OS and a red run on one OS is a real
# platform difference. A separate job checks the commit messages since
# the latest tag, and another runs the store and cli tests again on Linux
# against a Postgres service container, which no other runner can give.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and ref. A newer push to a pull request cancels the
# older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every commit since the latest tag follows Conventional Commits, as
  # cog.toml defines them: this catches a message that bypassed the
  # commit-msg hook. A separate job, so it neither gates nor is gated by
  # the tests. Full history, so cog can find the tag.
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: cog check
        uses: cocogitto/cocogitto-action@v3
        with:
          check-latest-tag-only: true

  # The store's contract suite, serve's store: block and core's waits and
  # wakes across two services on a real Postgres, which only a Linux runner
  # can give as a service container. The test
  # jobs below run the same tests without one and skip those cases, naming
  # CODE_CENTRAL_TEST_POSTGRES_URL, as make test does locally.
  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_central_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # -v so the log shows the Postgres cases run, not skipped.
      - name: go test
        env:
          CODE_CENTRAL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/code_central_test?sslmode=disable
        run: go test -v ./store/... ./cli/... ./core/...

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      # Before checkout, so Windows gets the repository's bytes, not CRLF.
      # .gitattributes says eol=lf too; this keeps it explicit.
      - name: No CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      # gofmt -l exits zero whatever it finds, so fail on any output.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files aren't gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Against the committed placeholder page, so no Vite build is needed.
      # -v so the log lists every skipped test with its reason: the
      # Postgres cases among them, which the test-postgres job runs.
      - name: go test
        run: go test -v ./...

      # The WASM Core the UI's tests run on, as `make corewasm` builds it.
      # A failing js build fails the run here.
      - name: core.wasm
        run: go run ./internal/corewasm web/src/api/core

      - name: vitest
        working-directory: web
        run: npx vitest run

      - name: tsc
        working-directory: web
        run: npx tsc --noEmit

      - name: eslint
        working-directory: web
        run: npx eslint .

      - name: Vite build
        working-directory: web
        run: npm run build

      # Storybook must keep building, as `make build-components` checks. It
      # needs the WASM Core built above.
      - name: Storybook build
        working-directory: web
        run: npm exec -- storybook build

      # As `make build`, with the OS's executable suffix (.exe on Windows,
      # empty elsewhere), and the fake gh `make e2e` builds. The absolute
      # paths go to the e2e steps.
      - name: Build binaries
        run: |
          exe=$(go env GOEXE)
          version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -tags webdist -ldflags "-X github.com/tomoram/code-central/cli.Version=$version" -o "bin/code-central$exe" ./cmd/code-central
          go build -o "bin/code-central-factory$exe" ./cmd/code-central-factory
          go build -o "bin/fake-gh$exe" ./internal/fakegh/gh
          echo "CODE_CENTRAL_BIN=$GITHUB_WORKSPACE/bin/code-central$exe" >> "$GITHUB_ENV"
          echo "CODE_CENTRAL_FACTORY_BIN=$GITHUB_WORKSPACE/bin/code-central-factory$exe" >> "$GITHUB_ENV"
          echo "CODE_CENTRAL_FAKE_GH_BIN=$GITHUB_WORKSPACE/bin/fake-gh$exe" >> "$GITHUB_ENV"

      - name: Install Chromium
        working-directory: web
        run: npx playwright-core install chromium

      # Windows takes ~25s to migrate a 10,000-Ticket store, mostly in
      # creating the staged files. A workaround until that is fixed: a
      # 1-minute startup budget there instead of 10s.
      - name: Go e2e
        env:
          CODE_CENTRAL_E2E_STARTUP_BUDGET: ${{ runner.os == 'Windows' && '1m' || '' }}
        run: go test -v -tags e2e -count=1 ./e2e/

      # PLAYWRIGHT_CHANNEL set but empty: the Chromium installed above, not
      # the system Chrome the suite defaults to.
      - name: UI e2e
        working-directory: web
        run: PLAYWRIGHT_CHANNEL= npm run test:e2e
