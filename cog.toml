# The commit convention, read by cocogitto (cog): the commit-msg hook in
# .githooks/ and the CI check both use this file. A version comes from
# the commits since the latest tag (v1.0.0 is the baseline); a release
# pushes that tag only. See docs/adr/0014.
tag_prefix = "v"
# The bump makes a tag only, never a commit on main, and no CHANGELOG.md.
disable_bump_commit = true
disable_changelog = true
# The Factory's landing merges and `Merge main into …` commits are exempt.
ignore_merge_commits = true

# cog's default types (feat, fix, docs, test, refactor, perf, build, ci,
# chore, style, revert) are all accepted. feat bumps the minor, fix the
# patch, and `!` or a BREAKING CHANGE: footer the major; perf also bumps
# the patch here. Every other type releases nothing.
[commit_types]
perf = { changelog_title = "Performance Improvements", bump_patch = true }
