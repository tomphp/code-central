# The Scale tier, nightly: the tests named TestScale…, which the CI
# workflow leaves out for their size. On Linux, macOS and Windows, it
# builds what `make e2e` builds, then runs the steps `make scale` runs,
# called directly rather than through make, under bash on every OS. The
# Windows job shares the local windows-setup action and gives the
# 10,000-Ticket test a 1m startup budget, which a Windows runner needs.
# Not a CI Rule: it is nightly, so no pull request waits on it.
name: Scale

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale:
    name: scale (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CODE_CENTRAL_E2E_STARTUP_BUDGET: ${{ matrix.os == 'windows-latest' && '1m' || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/windows-setup

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}

      - name: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: core.wasm
        run: go run ./internal/corewasm web/src/api/core

      - name: Vite build
        working-directory: web
        run: npm run build

      # As in ci.yml's e2e job.
      - name: Build binaries
        run: |
          exe=$(go env GOEXE)
          version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -tags webdist -ldflags "-X github.com/tomoram/code-central/cli.Version=$version" -o "bin/code-central$exe" ./cmd/code-central
          go build -o "bin/code-central-factory$exe" ./cmd/code-central-factory
          go build -o "bin/fake-gh$exe" ./internal/fakegh/gh
          echo "CODE_CENTRAL_BIN=$GITHUB_WORKSPACE/bin/code-central$exe" >> "$GITHUB_ENV"
          echo "CODE_CENTRAL_FACTORY_BIN=$GITHUB_WORKSPACE/bin/code-central-factory$exe" >> "$GITHUB_ENV"
          echo "CODE_CENTRAL_FAKE_GH_BIN=$GITHUB_WORKSPACE/bin/fake-gh$exe" >> "$GITHUB_ENV"

      - name: Scale (core)
        run: go test -v -tags scale -count=1 -run '^TestScale' ./...

      - name: Scale (e2e)
        run: go test -v -tags 'e2e scale' -count=1 -run '^TestScale' ./e2e/
